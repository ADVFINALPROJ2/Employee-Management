services:
  # 1. PostgreSQL Database Service
  postgres_db:
    image: postgres:15-alpine
    container_name: ems_postgres_container
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword123}
      POSTGRES_DB: ${DB_NAME:-ems_db}
    ports:
      - "${DB_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ems_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ems_network

  # 2. NestJS Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${NODE_ENV:-development}
    container_name: ems_backend_container
    restart: always
    ports:
      - "${BACKEND_PORT_HOST:-3001}:${BACKEND_PORT_CONTAINER:-3001}"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT_CONTAINER:-3001}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-securepassword123}@postgres_db:5432/${DB_NAME:-ems_db}?schema=public
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
      # - /usr/src/app/dist
    depends_on:
      postgres_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${BACKEND_PORT_CONTAINER:-3001}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - ems_network

  # 3. Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${NODE_ENV:-development}
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: ems_frontend_container
    restart: always
    ports:
      - "${FRONTEND_PORT_HOST:-3000}:${FRONTEND_PORT_CONTAINER:-3000}"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${FRONTEND_PORT_CONTAINER:-3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    volumes:
      - ./frontend:/usr/src/app:Z
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${FRONTEND_PORT_CONTAINER:-3000}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - ems_network

volumes:
  postgres_data:

networks:
  ems_network:
    driver: bridge
