services:
  postgres_db:
    image: postgres:15-alpine
    container_name: ems_postgres_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: ems_db
    ports:
      - "5433:5432" # <-- Changed local machine port to 5433 to avoid the clash!
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: